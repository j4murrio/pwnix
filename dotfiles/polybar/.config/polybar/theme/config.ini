;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Global WM Settings
[global/wm]
margin-bottom = 0
margin-top = 0

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; File Inclusion
include-file = ~/.config/polybar/theme/colors.ini
include-file = ~/.config/polybar/theme/glyphs.ini
include-file = ~/.config/polybar/theme/modules.ini

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Bar Settings
[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 99%
height = 26

offset-x = 0.5%
offset-y = 8

background = ${color.bg}
foreground = ${color.fg}

radius = 4.0

line-size = 2
line-color = ${color.blue}

border-size = 8px
border-color = ${color.bg}

padding = 1

module-margin-left = 0
module-margin-right = 0

; Text
font-0 = "JetBrainsMono Nerd Font:pixelsize=10;3"
; Icons
font-1 = "JetBrainsMono Nerd Font:style=Medium:size=22;5"
font-2 = "JetBrainsMono Nerd Font:style=Medium:size=11;3"
font-3 = "JetBrainsMono Nerd Font:style=Medium:size=15;4"
; Glyphs
font-4 = "JetBrainsMono Nerd Font:style=Medium:size=17;4"

;Modules availables but not active:
modules-left = launcher dots bi ethernet_status bd sep bi vpn_status bd sep bi set_target bd
modules-center = bi workspaces bd
modules-right = bi cpu_bar bd sep bi filesystem bd sep bi pulseaudio bd sep bi updates bd sep bi date bd dots sysmenu

separator =
dim-value = 1.0

;;locale = en_US.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Application Settings
[settings]
screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Machine-local overrides, loaded last so they win. Outside the repo, so a
;; dotfiles update cannot discard them. sync.sh creates it empty if missing.
include-file = ~/.config/polybar.local.ini
