;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/launcher]
type = custom/text

; Set by launch.sh from the running distribution. The fallbacks are Arch's, so the
; bar still renders if polybar is started by hand without them.
label = "${env:PWNIX_OS_GLYPH:󰣇}"
label-foreground = ${env:PWNIX_OS_COLOR:#0A9CF5}
label-font = 4
label-padding = 1

click-left = ~/.config/rofi/scripts/launcher.sh &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/sysmenu]
type = custom/text

label = ""
label-foreground = ${color.red}
label-font = 4
label-padding = 1

click-left = ~/.config/rofi/scripts/powermenu.sh &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/updates]
type = custom/script

exec = ~/.config/polybar/theme/scripts/updates.sh
tail = true
interval = 5

format = <label>
format-prefix = " %{O3}"
format-prefix-font = 3
format-prefix-foreground = ${color.lime}
format-background = ${color.mb}
format-padding = 1

label = %output%

click-left = kitty --title "System Update" -e ~/.config/polybar/theme/scripts/update-system.sh --own-terminal

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/pulseaudio]
type = internal/pulseaudio

; sink auto-detected (leave empty to use default PulseAudio sink)
sink =
use-ui-max = false
interval = 5

format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-font = 3
format-volume-foreground = ${color.cyan}
format-volume-background = ${color.mb}
format-volume-padding = 1

format-muted = <label-muted>
format-muted-prefix = "󰖁 "
format-muted-prefix-font = 3
format-muted-foreground = ${color.red}
format-muted-background = ${color.mb}
format-muted-padding = 1

label-volume = "%percentage%%"
label-volume-foreground = ${color.fg}

label-muted = "Muted"
label-muted-foreground = ${color.red}

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/date]
type = internal/date

interval = 1.0

time = %I:%M %P
date-alt = "%a, %d %b %Y"

format = <label>
format-prefix = ""
format-prefix-font = 2
format-prefix-foreground = ${color.blue-gray}
format-foreground = ${color.fg}
format-background = ${color.mb}
format-padding = 1

label = "%time%%date%"

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/workspaces]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false

format = <label-state>
format-font = 3
format-background = ${color.mb}

icon-0 = 1
icon-1 = 2
icon-2 = 3
icon-3 = 4
icon-4 = 5
icon-default = ""

label-active = ""
label-active-foreground = ${color.yellow}
label-active-padding = 1

label-focused = ""
label-focused-foreground = ${color.green}
label-focused-padding = 1

label-occupied = ""
label-occupied-foreground = ${color.blue}
label-occupied-padding = 1

label-urgent = "󰀨"
label-urgent-foreground = ${color.pink}
label-urgent-padding = 1

label-empty = ""
label-empty-foreground = ${color.purple}
label-empty-padding = 1

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/ethernet_status]
type = custom/script

exec = ~/.config/polybar/theme/scripts/ethernet_status.sh
interval = 2

format = <label>
format-prefix = "󰈀 "
format-prefix-font = 3
format-prefix-foreground = ${color.yellow}
format-background = ${color.mb}
format-padding = 1

label = %output%

click-left = ~/.config/polybar/theme/scripts/ethernet_status.sh | tr -d '\\n' | xclip -selection clipboard

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/vpn_status]
type = custom/script

exec = ~/.config/polybar/theme/scripts/vpn_status.sh
interval = 2

format = <label>
format-prefix = " "
format-prefix-font = 3
format-prefix-foreground = ${color.blue}
format-background = ${color.mb}
format-padding = 1

label = %output%

click-left = ~/.config/polybar/theme/scripts/vpn_status.sh | tr -d '\\n' | xclip -selection clipboard

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/set_target]
type = custom/script

exec = ~/.config/polybar/theme/scripts/set_target.sh
interval = 2

format = <label>
format-prefix = "󰓾 "
format-prefix-font = 3
format-prefix-foreground = ${color.pink}
format-background = ${color.mb}
format-padding = 1

label = %output%

click-left = ~/.config/polybar/theme/scripts/set_target.sh | tr -d '\\n' | xclip -selection clipboard

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/filesystem]
type = internal/fs

mount-0 = /
interval = 60
fixed-values = true

format-mounted = <label-mounted>
format-mounted-prefix = " "
format-mounted-prefix-font = 3
format-mounted-prefix-foreground = ${color.amber}
format-mounted-background = ${color.mb}
format-mounted-padding = 1

format-unmounted = <label-unmounted>
format-unmounted-prefix = " "
format-unmounted-prefix-font = 3
format-unmounted-background = ${color.mb}
format-unmounted-padding = 1

label-mounted = %free%

label-unmounted = %mountpoint%: Not mounted

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/cpu_bar]
type = internal/cpu

interval = 0.5

format = <label>
format-prefix = " "
format-prefix-font = 3
format-prefix-foreground = ${color.red}
format-background = ${color.mb}
format-padding = 1

label = %percentage%%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
