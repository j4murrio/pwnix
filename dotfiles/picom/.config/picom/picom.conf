# Backend - xrender is the most compatible with VMware (SVGA)
# If using real hardware with dedicated GPU, change to "glx"
backend = "xrender";
vsync = true;

# Prevent tearing and visual artifacts
use-damage = false;
#refresh-rate = 0;   # Auto-detect refresh rate

# Window detection
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# IMPORTANT: this prevents flickering
unredir-if-possible = false;

# Global opacity
active-opacity = 0.95;
inactive-opacity = 0.7;
inactive-dim = 0.0;

opacity-rule = [
  "70:class_i = 'presel_feedback'"
];

# Fade animations
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Rounded corners
corner-radius = 6;
rounded-corners-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'Polybar'"
];
