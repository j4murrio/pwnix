include theme.conf

# ██████████████████████████████████████████████████████████████
#                    CONFIGURATION
# ██████████████████████████████████████████████████████████████

# Font and cursor
font_family JetBrainsMono Nerd Font
font_size 10.5
cursor_shape block
cursor_stop_blinking_after 0

# Behavior
shell zsh
scrollback_lines 2000
copy_on_select no
mouse_hide_wait 3.0
select_by_word_characters @-./_~?&=%+#a
enable_audio_bell no
bell_on_tab "🔔 "
confirm_os_window_close 0
detect_urls yes
url_style curly

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Window and tab appearance
remember_window_size no
window_border_width 1pt
draw_minimal_borders yes
window_padding_width 10
inactive_text_alpha 0.6
hide_window_decorations yes
background_opacity 0.95
tab_bar_style powerline
tab_powerline_style round

# ██████████████████████████████████████████████████████████████
#                    KEYBINDINGS
# ██████████████████████████████████████████████████████████████
# Kitty: Ctrl+Shift+key, Alt+arrows
# Free for zsh: Ctrl+arrows, Home, End, Delete

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Tabs
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward

# Splits / Windows
map ctrl+shift+w new_window_with_cwd
map ctrl+shift+x close_window
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down
map ctrl+shift+z toggle_layout stack
map ctrl+shift+l next_layout
map ctrl+shift+r start_resizing_window

# Scroll
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# Buffers
map ctrl+shift+f1 copy_to_buffer a
map ctrl+shift+f2 paste_from_buffer a
map ctrl+shift+f3 copy_to_buffer b
map ctrl+shift+f4 paste_from_buffer b

# Machine-local overrides, loaded last so they win. Outside the repo, so a dotfiles
# update cannot discard them. include, not globinclude: the latter hands the pattern
# to Path.glob(), which rejects absolute paths. A missing file is only logged.
include ${HOME}/.config/kitty.local.conf
